<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Management{% endblock %}</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body { padding-top: 50px; padding-bottom: 20px; }
        .navbar { margin-bottom: 20px; }
        .form-container { max-width: 500px; margin: 0 auto; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
    <a class="navbar-brand" href="#">{% block navbar_title %}Management{% endblock %}</a>
    <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="/dashboard_users">Users</a></li>
        <li class="nav-item"><a class="nav-link" href="/dashboard_products">Products</a></li>
    </ul>
</nav>

<div class="container">
    {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
