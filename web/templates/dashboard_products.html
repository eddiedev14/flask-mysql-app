{% extends "base.html" %}

{% block title %}Product Management{% endblock %}
{% block navbar_title %}Product Management{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New Product</h2>
    <form id="add-product-form">
        <div class="form-group">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" required>
        </div>
        <div class="form-group">
            <label for="stock">Stock</label>
            <input type="number" class="form-control" id="stock" required>
        </div>
        <div class="form-group">
            <label for="price">Price</label>
            <input type="number" step="0.01" class="form-control" id="price" required>
        </div>
        <button type="button" onclick="createProduct()">Create Product</button>
    </form>
</div>

<h2>Products List</h2>
<table id="product-list" class="table table-striped">
    <thead>
        <tr>
            <th>Name</th>
            <th>Stock</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>
<button type="button" onclick="getProducts()">Get Products</button>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='script_products.js') }}"></script>
{% endblock %}
